name: Check iPhone Duo stock

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub treats this as "about every 5 min", often slower
  workflow_dispatch:          # lets you hit "Run workflow" by hand

# Each job asks for only what it needs. There are no pull_request triggers,
# so nobody else's fork can run this or see the NTFY_TOPIC secret.
permissions: {}

# One run at a time, so a run never works from state.json older than the
# last run's.
concurrency:
  group: duo-check
  cancel-in-progress: false

# Actions are pinned to commit SHAs (tag in the comment) so a moved tag can't
# change what runs here.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write   # commit state.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the commit this run was queued at, so a run
          # that waited behind another one sees the state.json it saved.
          ref: ${{ github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node check.js

      # state.json only changes when stock or the failure streak does, so
      # most runs commit nothing. status.json is never committed: it goes
      # straight to Pages below.
      - name: Save state
        run: |
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update stock state"
          # If main moved during this run (say you pushed), rebase and retry.
          # Losing this commit would mean repeat alerts next run.
          for try in 1 2 3; do
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1

      - name: Build page
        run: mkdir _site && cp index.html status.json _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10   # deploy-pages waits up to 10 min for Pages itself
    permissions:
      pages: write      # publish the page
      id-token: write   # lets deploy-pages prove the request comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
